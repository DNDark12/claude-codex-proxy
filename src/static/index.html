<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>claude-codex-proxy — Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #7d8590; --accent: #58a6ff;
    --green: #3fb950; --yellow: #d29922; --red: #f85149;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Nav */
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; height: 48px; gap: 24px; }
  nav .logo { font-weight: 600; color: var(--text); font-size: 15px; }
  nav a { color: var(--muted); font-size: 13px; padding: 4px 8px; border-radius: 6px; }
  nav a:hover, nav a.active { color: var(--text); background: var(--border); text-decoration: none; }

  /* Layout */
  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }

  /* Grid cards */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .stat-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .stat-card .value { font-size: 28px; font-weight: 700; }
  .stat-card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

  /* Sections */
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 24px; overflow: hidden; }
  .section-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .section-header h2 { font-size: 15px; font-weight: 600; }
  .section-body { padding: 20px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { color: var(--muted); font-weight: 500; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }

  /* Badges */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
  .badge-green { background: rgba(63,185,80,.15); color: var(--green); }
  .badge-yellow { background: rgba(210,153,34,.15); color: var(--yellow); }
  .badge-red { background: rgba(248,81,73,.15); color: var(--red); }
  .badge-blue { background: rgba(88,166,255,.15); color: var(--accent); }
  .badge-muted { background: rgba(125,133,144,.15); color: var(--muted); }

  /* Mode display */
  .mode-block { display: flex; gap: 12px; flex-wrap: wrap; }
  .mode-item { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 16px; min-width: 160px; }
  .mode-item .k { color: var(--muted); font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
  .mode-item .v { font-size: 13px; font-weight: 500; }

  /* Loading / error */
  .loading { color: var(--muted); font-size: 13px; padding: 24px; text-align: center; }
  .error-msg { color: var(--red); font-size: 13px; padding: 12px; background: rgba(248,81,73,.08); border-radius: 6px; }

  /* Refresh btn */
  .btn { background: var(--border); color: var(--text); border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: #3d444d; }

  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot-green { background: var(--green); }
  .dot-yellow { background: var(--yellow); }
  .dot-red { background: var(--red); }
  .dot-muted { background: var(--muted); }
</style>
</head>
<body>

<nav>
  <span class="logo">⬡ claude-codex-proxy</span>
  <a href="/" class="active">Dashboard</a>
  <a href="/accounts">Accounts</a>
  <a href="/sessions">Sessions</a>
  <a href="/bridge/compatibility" target="_blank">Compatibility</a>
</nav>

<main>
  <h1>Dashboard</h1>
  <p class="subtitle" id="last-updated">Loading...</p>

  <div class="stats-grid" id="stats-grid">
    <div class="stat-card"><div class="label">Accounts</div><div class="value" id="s-accounts">—</div><div class="sub" id="s-accounts-sub"></div></div>
    <div class="stat-card"><div class="label">Active Sessions</div><div class="value" id="s-sessions">—</div><div class="sub">in database</div></div>
    <div class="stat-card"><div class="label">Jobs</div><div class="value" id="s-jobs">—</div><div class="sub" id="s-jobs-sub"></div></div>
    <div class="stat-card"><div class="label">Mode</div><div class="value" id="s-mode" style="font-size:18px">—</div><div class="sub" id="s-mode-sub"></div></div>
  </div>

  <!-- Operation Mode -->
  <div class="section">
    <div class="section-header">
      <h2>Operation Mode</h2>
      <button class="btn" onclick="loadAll()">↻ Refresh</button>
    </div>
    <div class="section-body">
      <div class="mode-block" id="mode-block"><div class="loading">Loading mode info...</div></div>
    </div>
  </div>

  <!-- Accounts summary -->
  <div class="section">
    <div class="section-header">
      <h2>Accounts</h2>
      <a href="/accounts">Manage →</a>
    </div>
    <div class="section-body" id="accounts-body">
      <div class="loading">Loading accounts...</div>
    </div>
  </div>

  <!-- Recent Sessions -->
  <div class="section">
    <div class="section-header">
      <h2>Recent Sessions</h2>
      <a href="/sessions">View all →</a>
    </div>
    <div id="sessions-body">
      <div class="loading">Loading sessions...</div>
    </div>
  </div>
</main>

<script>
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

function statusBadge(s) {
  if (!s) return '<span class="badge badge-muted">unknown</span>';
  if (s.degraded) return '<span class="badge badge-yellow">degraded</span>';
  if (!s.enabled) return '<span class="badge badge-muted">disabled</span>';
  return '<span class="badge badge-green">active</span>';
}

function dot(s) {
  if (!s) return '<span class="dot dot-muted"></span>';
  if (s.degraded) return '<span class="dot dot-yellow"></span>';
  if (!s.enabled) return '<span class="dot dot-muted"></span>';
  return '<span class="dot dot-green"></span>';
}

async function loadMode() {
  try {
    const d = await fetchJSON('/bridge/mode');
    const mode = d.operationMode || d.mode || 'unknown';
    // Remove JSON string fallback from the main badge to avoid overflow
    document.getElementById('s-mode').textContent = mode.replace('_', '-');
    document.getElementById('s-mode-sub').textContent = d.degraded ? '⚠ degraded' : 'nominal';

    const items = [
      ['Operation Mode', mode],
      ['API Stability', d.apiStability || '—'],
      ['Delegation Policy', d.delegationPolicy || '—'],
      ['App Server', d.appServerAvailable ? '✓ available' : '✗ unavailable'],
      ['Fallback', d.responsesFallbackAvailable ? '✓ ready' : '✗ unavailable'],
    ];
    document.getElementById('mode-block').innerHTML = items.map(([k, v]) =>
      `<div class="mode-item"><div class="k">${k}</div><div class="v">${v}</div></div>`
    ).join('');
  } catch(e) {
    document.getElementById('mode-block').innerHTML = `<div class="error-msg">Could not load /bridge/mode: ${e.message}</div>`;
  }
}

async function loadAccounts() {
  try {
    const d = await fetchJSON('/api/accounts');
    const accounts = d.data || [];
    const active = accounts.filter(a => a.status.enabled && !a.status.degraded).length;
    document.getElementById('s-accounts').textContent = accounts.length;
    document.getElementById('s-accounts-sub').textContent = `${active} active`;

    if (accounts.length === 0) {
      document.getElementById('accounts-body').innerHTML = '<div class="loading">No accounts configured</div>';
      return;
    }

    document.getElementById('accounts-body').innerHTML = `
      <table>
        <thead><tr><th>Account</th><th>Auth Path</th><th>Status</th><th>Requests</th><th>Errors</th><th>Last Used</th></tr></thead>
        <tbody>${accounts.map(a => `
          <tr>
            <td>${dot(a.status)}<strong>${a.label}</strong><br><small style="color:var(--muted)">${a.id}</small></td>
            <td style="color:var(--muted);font-family:monospace;font-size:12px">${a.auth_path}</td>
            <td>${statusBadge(a.status)}</td>
            <td>${a.status.total_requests ?? 0}</td>
            <td>${a.status.error_count ?? 0}${a.status.degraded ? ` <small style="color:var(--yellow)">(cooldown ${a.status.cooldown_remaining_secs}s)</small>` : ''}</td>
            <td style="color:var(--muted)">${a.status.last_used_secs_ago != null ? ago(a.status.last_used_secs_ago) : '—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  } catch(e) {
    document.getElementById('accounts-body').innerHTML = `<div class="error-msg">${e.message}</div>`;
  }
}

async function loadSessions() {
  try {
    const d = await fetchJSON('/bridge/jobs');
    const jobs = Array.isArray(d) ? d : (d.jobs || d.data || []);
    const running = jobs.filter(j => j.status === 'running').length;
    document.getElementById('s-jobs').textContent = jobs.length;
    document.getElementById('s-jobs-sub').textContent = `${running} running`;

    // Recent sessions from /bridge/session would need listing endpoint
    // Use jobs as proxy for activity
    document.getElementById('sessions-body').innerHTML = jobs.length === 0
      ? '<div class="loading" style="padding:20px">No recent jobs</div>'
      : `<table>
          <thead><tr><th>Job ID</th><th>Surface</th><th>Status</th><th>Account</th><th>Started</th></tr></thead>
          <tbody>${jobs.slice(0,10).map(j => `
            <tr>
              <td style="font-family:monospace;font-size:12px">${j.id.slice(0,8)}…</td>
              <td>${j.surface || '—'}</td>
              <td>${jobBadge(j.status)}</td>
              <td style="color:var(--muted)">${j.account_id || '—'}</td>
              <td style="color:var(--muted)">${j.created_at ? new Date(j.created_at*1000).toLocaleTimeString() : '—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
  } catch(e) {
    document.getElementById('sessions-body').innerHTML = `<div class="loading" style="padding:20px;color:var(--muted)">No job data available</div>`;
    document.getElementById('s-jobs').textContent = '—';
  }
}

function jobBadge(s) {
  const map = { running: 'blue', done: 'green', failed: 'red', pending: 'muted' };
  return `<span class="badge badge-${map[s]||'muted'}">${s}</span>`;
}

function ago(secs) {
  if (secs < 60) return `${secs}s ago`;
  if (secs < 3600) return `${Math.floor(secs/60)}m ago`;
  return `${Math.floor(secs/3600)}h ago`;
}

async function loadAll() {
  document.getElementById('last-updated').textContent = 'Refreshing...';
  await Promise.all([loadMode(), loadAccounts(), loadSessions()]);
  document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
}

loadAll();
setInterval(loadAll, 15000);
</script>
</body>
</html>
